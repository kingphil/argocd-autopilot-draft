apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  creationTimestamp: null
  name: development
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: development project
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
status: {}

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  creationTimestamp: null
  name: development
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/kingphil/argocd-autopilot-draft.git
        revision: main
        files:
          - path: clusters/development/**/config.yaml
        template:
          metadata: {}  ## required
          spec:
            destination: {}  ## required
            project: ""  ## required
            source:
              repoURL: ""  ## required
              path: '{{ .srcPath }}'
              helm:
                valueFiles:
                  - values.yaml
                  ## note the prepended slash, as this is not relative to source.path above
                  - /{{ .path.path }}/values.yaml
                ignoreMissingValueFiles: false
    - git:
        repoURL: https://github.com/kingphil/argocd-autopilot-draft.git
        revision: main
        files:
          - path: clusters/development/**/config_dir.yaml
        template:
          metadata: {}  ## required
          spec:
            destination: {}  ## required
            project: ""  ## required
            source:
              repoURL: ""  ## required
              path: '{{ .path.path }}'
              directory:
                recurse: true
                exclude: '{{ .path.filename }}'
                include: '*.yaml'
  syncPolicy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: '{{ .appName }}'
      name: development-{{ .userGivenName }}
      namespace: argocd
    spec:
      source:
        repoURL: '{{ .srcRepoURL }}'
        targetRevision: '{{ .srcTargetRevision }}'
      destination:
        namespace: '{{ .destNamespace }}'
        server: '{{ .destServer }}'
      project: development
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
