rollOutCiliumPods: true

kubeProxyReplacement: true
k8sServiceHost: 172.16.0.53
k8sServicePort: 6443

bgpControlPlane:
  enabled: true

ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  defaultSecretNamespace: kube-system
  defaultSecretName: star.demo.codemonkeys.site

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: true
      className: cilium
      hosts:
        - hubble-home.demo.codemonkeys.site
      tls:
        - hosts:
            - hubble-home.demo.codemonkeys.site
