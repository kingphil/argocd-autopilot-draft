version: '3'

tasks:
  kind-create:
    desc: Create kind development cluster
    cmds:
      - kind create cluster --name lab --kubeconfig $HOME/.kube/kind --config tools/kind/kind.yaml

  kind-delete:
    desc: Delete kind development cluster
    cmds:
      - KUBECONFIG=$HOME/.kube/kind kind delete cluster --name lab
      - rm -f $HOME/.kube/kind

  cilium-install:
    desc: Helm install of cilium to current K8s context
    vars:
      CONTEXT: '{{default "clusters/development" .CONTEXT}}'
    cmds:
      - helm repo add cilium https://helm.cilium.io/
      - helm repo update cilium
      - |
        CILIUM_VERSION=1.18.x
        helm upgrade --install --wait cilium \
          -n kube-system \
          --values charts/cilium/values.yaml \
          --values {{.CONTEXT}}/cilium/values.yaml \
          --version $CILIUM_VERSION \
          cilium/cilium

  cilium-install-alpha:
    desc: Helm install of cilium to current K8s context
    vars:
      CONTEXT: '{{default "clusters/development" .CONTEXT}}'
    cmds:
      - helm repo add cilium https://helm.cilium.io/
      - helm repo update cilium
      - |
        CILIUM_VERSION=1.19.x
        helm upgrade --install cilium \
          -n kube-system \
          --values charts/cilium/values.yaml \
          --values {{.CONTEXT}}/cilium/values.yaml \
          --version $CILIUM_VERSION \
          cilium/cilium
      - kubectl -n kube-system wait --for=condition=Available deployment/cilium-operator --timeout=300s
      - kubectl -n kube-system rollout status ds/cilium-envoy
      - |
        if [ -d "{{.CONTEXT}}/cilium/manifests/" ]; then
            kubectl apply -f {{.CONTEXT}}/cilium/manifests/
        fi

  argocd-bootstrap:
    desc: Helm "bootstrap" install of argocd
    vars:
      CONTEXT: '{{default "clusters/development" .CONTEXT}}'
    cmds:
      - helm repo add argo https://argoproj.github.io/argo-helm
      - helm install --wait argocd argo/argo-cd -n argocd --create-namespace --values {{.CONTEXT}}/argocd/values.yaml --version 7.9.x
      - kubectl create -f $HOME/povault/k8s-secrets/{{.CONTEXT}}/ || /bin/true
      - kubectl create -f {{.CONTEXT}}/

  kind-install:
    desc: Install kind
    cmds:
      - |
        (
          cd "$(mktemp -d)" &&
          OS="$(uname | tr '[:upper:]' '[:lower:]')" &&
          ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')" &&
          KIND="kind-${OS}-${ARCH}" &&
          curl -fsSLO "https://github.com/kubernetes-sigs/kind/releases/latest/download/${KIND}" &&
          sudo install -o root -g root -m 0755 $KIND /usr/local/bin/kind
        )

  k3d-install:
    desc: Install kind
    cmds:
      - |
        (
          cd "$(mktemp -d)" &&
          OS="$(uname | tr '[:upper:]' '[:lower:]')" &&
          ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')" &&
          K3D="k3d-${OS}-${ARCH}" &&
          curl -fsSLO "https://github.com/k3d-io/k3d/releases/latest/download/${K3D}" &&
          sudo install -o root -g root -m 0755 $K3D /usr/local/bin/k3d
        )

  k3d-create:
    vars:
      NAME: '{{default "lab" .NAME}}'
    desc: Create k3d development cluster
    cmds:
      - KUBECONFIG=$HOME/.kube/{{.NAME}} k3d cluster create {{.NAME}} --config tools/k3d/k3d.{{.NAME}}.yaml

  k3d-delete:
    desc: Delete k3d development cluster
    vars:
      NAME: '{{default "lab" .NAME}}'
    cmds:
      - KUBECONFIG=$HOME/.kube/{{.NAME}} k3d cluster delete {{.NAME}}
      - rm -f $HOME/.kube/{{.NAME}}

  run-netshoot:
    desc: Run netshoot pod (in current context) for network diagnosis
    vars:
      COMMAND: '{{default "sh" .COMMAND}}'
    cmds:
      - kubectl run netshoot --image=nicolaka/netshoot --rm -it --restart=Never -- {{.COMMAND}}
