version: '3'

tasks:
  kind-create:
    desc: Create kind development cluster
    cmds:
      - kind create cluster --name lab --kubeconfig $HOME/.kube/kind --config misc/kind/kind.yaml

  kind-delete:
    desc: Delete kind development cluster
    cmds:
      - KUBECONFIG=$HOME/.kube/kind kind delete cluster --name lab
      - rm -f $HOME/.kube/kind

  cilium-install:
    desc: Helm install of cilium to current K8s context
    cmds:
      - helm repo add cilium https://helm.cilium.io/
      - helm dep update examples/cilium/
      - helm install --wait cilium examples/cilium/ -n kube-system

  secrets-prereq:
    desc: Install secrets in given CONTEXT (default "development")
    vars:
      CONTEXT: '{{default "development" .CONTEXT}}'
    cmds:
      - kubectl create -f $HOME/povault/k8s-secrets/{{.CONTEXT}} || /bin/true

  argocd-bootstrap:
    desc: Helm "bootstrap" install of argocd
    vars:
      CONTEXT: '{{default "development" .CONTEXT}}'
    deps:
      - secrets-prereq
    cmds:
      - helm repo add argo-helm https://argoproj.github.io/argo-helm
      - helm dep update bootstrap/argocd/
      - helm install --wait argocd bootstrap/argocd/ -n argocd --create-namespace
      - kubectl create -f $HOME/povault/k8s-secrets/{{.CONTEXT}}/post-argocd/ || /bin/true
