apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  name: experimental
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: experimental project
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
status: {}

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: experimental
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/kingphil/argocd-autopilot-draft.git
        revision: main
        files:
          - path: clusters/experimental/**/config.yaml
  template:
    metadata:
      name: experimental-{{ .userGivenName }}
      namespace: argocd
    spec:
      source:
        repoURL: '{{ .srcRepoURL }}'
        path: '{{ .srcPath }}'
        targetRevision: '{{ .srcTargetRevision }}'
        helm:
          valueFiles:
            - values.yaml
            ## note the prepended slash, as this is not relative to source.path above
            - /{{ .path.path }}/values.yaml
          ignoreMissingValueFiles: true
      destination:
        namespace: '{{ .destNamespace }}'
        server: '{{ .destServer }}'
      project: experimental
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
