apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-podinfo
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: bootstrap/cluster-resources/in-cluster/helm-podinfo
    repoURL: https://github.com/kingphil/argocd-autopilot-draft
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - allowEmpty=true
